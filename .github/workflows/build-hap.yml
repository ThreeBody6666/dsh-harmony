name: 云端编译 HAP

# 目的：在 GitHub Actions 里用 HarmonyOS 命令行工具链编译本工程，
# 产出未签名 HAP（含本机引擎的 libnode 与 dsh 核心树）。不需要 DevEco Studio。
#
# 镜像：ghcr.io/dalongzhuazi/harmonyos-ci（MIT，公开可拉）

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      image:
        description: '覆盖镜像'
        required: false
        default: ''
      sdk:
        description: '镜像对应 SDK 版本'
        required: false
        default: '26.0.0'

concurrency:
  group: build-hap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

env:
  CI_IMAGE: ghcr.io/dalongzhuazi/harmonyos-ci:api26r

jobs:
  guard:
    name: 检查是否鸿蒙工程
    runs-on: ubuntu-latest
    outputs:
      is_project: ${{ steps.check.outputs.is_project }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f build-profile.json5 ] && [ -f oh-package.json5 ]; then
            echo "is_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_project=false" >> "$GITHUB_OUTPUT"
            echo "::notice::不是鸿蒙工程，跳过"
          fi

  prepare:
    name: 解析镜像
    needs: guard
    if: needs.guard.outputs.is_project == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.img.outputs.image }}
    steps:
      - id: img
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          DEFAULT_IMAGE: ${{ env.CI_IMAGE }}
        run: echo "image=${INPUT_IMAGE:-$DEFAULT_IMAGE}" >> "$GITHUB_OUTPUT"

  build:
    name: 构建（debug / 未签名）
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 打印工具链版本
        run: |
          set -x
          node -v || true
          hvigorw --version || true
          ohpm -v || true

      - name: 剥离本机签名配置
        run: |
          if [ -f .github/scripts/strip_signing.py ]; then
            python3 .github/scripts/strip_signing.py build-profile.json5
          fi

      - name: 安装依赖
        run: ohpm install --all

      - name: 缓存运行时物料
        uses: actions/cache@v4
        with:
          path: |
            entry/libs
            entry/src/main/resources/rawfile
            entry/src/main/cpp/vendor/node
          key: local-runtime-${{ hashFiles('scripts/prepare-local-runtime.sh') }}

      - name: 准备本机运行时（libnode + dsh 核心树）
        run: bash scripts/prepare-local-runtime.sh

      - name: 取 node 头文件（与 libnode 同版本）
        run: |
          set -eux
          NODE_VER="24.2.0"
          mkdir -p entry/src/main/cpp/vendor/node
          if [ ! -f entry/src/main/cpp/vendor/node/include/node.h ]; then
            curl -fsSL -o /tmp/node-headers.tar.gz \
              "https://nodejs.org/dist/v${NODE_VER}/node-v${NODE_VER}-headers.tar.gz"
            tar -xzf /tmp/node-headers.tar.gz -C entry/src/main/cpp/vendor/node --strip-components=1
          fi
          ls entry/src/main/cpp/vendor/node/include | head

      - name: 构建 HAP（对齐镜像 SDK，逐个试 modelVersion）
        env:
          SDK_VERSION: ${{ inputs.sdk || '26.0.0' }}
        run: |
          set -uo pipefail
          rm -rf entry/build .hvigor entry/.cxx
          python3 .github/scripts/patch-sdk.py build-profile.json5 \
            --compile "$SDK_VERSION" --compatible "$SDK_VERSION"
          CANDIDATES=("$SDK_VERSION" "6.1.1" "6.0.0")
          ok=0
          for v in "${CANDIDATES[@]}"; do
            echo "::group::尝试 modelVersion=$v（SDK=$SDK_VERSION）"
            python3 .github/scripts/ci-prepare.py "$v"
            if hvigorw assembleHap --mode module -p product=default -p buildMode=debug \
                 --no-daemon --stacktrace 2>&1 | tee "/tmp/build-$v.log"; then
              echo "::endgroup::"
              echo "::notice::构建成功，modelVersion=$v"
              ok=1
              break
            fi
            echo "::endgroup::"
            echo "::warning::modelVersion=$v 失败"
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::所有候选都失败"
            exit 1
          fi

      - name: 校验 HAP 里的运行时
        if: always()
        run: |
          set -eux
          HAP=$(find . -name '*.hap' -path '*/outputs/*' | head -1)
          if [ -n "${HAP:-}" ]; then
            ls -lh "$HAP"
            python3 scripts/list-hap.py "$HAP"
          fi

      - name: 收集并校验产物
        run: |
          set -eu
          mkdir -p dist
          find . -type f -name '*.hap' -path '*/outputs/*' \
            -not -path './oh_modules/*' -not -path './node_modules/*' \
            -exec cp -v {} dist/ \;
          shopt -s nullglob
          haps=(dist/*.hap)
          if [ ${#haps[@]} -eq 0 ]; then
            echo "::error::没有产出 hap"
            exit 1
          fi
          for h in "${haps[@]}"; do
            echo "$h : $(stat -c%s "$h") bytes"
          done

      - name: 上传 HAP
        uses: actions/upload-artifact@v4
        with:
          name: hap-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: 失败时带出日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build-*.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: 发布到 Release（直链下载）
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hap-unsigned
          path: dist

      - name: 更新滚动 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          TAG=local-latest
          cat > /tmp/notes.md <<'EOF'
          ## DSH Go 鸿蒙端 · 滚动构建

          未签名 debug HAP，含本机引擎（dsh 核心树 + Node 运行时）。
          侧载后需自行签名安装。

          源码：https://github.com/ThreeBody6666/dsh-harmony
          EOF
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "local-latest ($(date -u +%Y-%m-%d\ %H:%M) UTC)" \
            --notes-file /tmp/notes.md \
            --prerelease \
            dist/*.hap
          echo "::notice::下载直链：https://github.com/${{ github.repository }}/releases/download/$TAG/$(basename $(ls dist/*.hap))"
