name: 云端编译 HAP

# 目的：在 GitHub Actions 里用 HarmonyOS 命令行工具链编译本工程，
# 产出未签名 HAP + 完整编译日志。不需要 DevEco Studio，也不需要本地 SDK。
#
# 镜像说明：ghcr.io/dalongzhuazi/harmonyos-ci（MIT，公开可匿名拉取），
# 把官方 command-line-tools 打成了 Docker 镜像。
# 参考：https://github.com/DaLongZhuaZi/harmonyos-ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      image:
        description: '覆盖镜像（默认 ghcr.io/dalongzhuazi/harmonyos-ci:api26r）'
        required: false
        default: ''
      sdk:
        description: '镜像对应的 SDK 版本（仓库默认按 API 12 写，CI 需要改写成这个）'
        required: false
        default: '26.0.0'

concurrency:
  group: build-hap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

env:
  CI_IMAGE: ghcr.io/dalongzhuazi/harmonyos-ci:api26r

jobs:
  guard:
    name: 检查是否鸿蒙工程
    runs-on: ubuntu-latest
    outputs:
      is_project: ${{ steps.check.outputs.is_project }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f build-profile.json5 ] && [ -f oh-package.json5 ]; then
            echo "is_project=true" >> "$GITHUB_OUTPUT"
            echo "OK: 检测到鸿蒙工程"
          else
            echo "is_project=false" >> "$GITHUB_OUTPUT"
            echo "::notice::缺少 build-profile.json5 / oh-package.json5，跳过构建"
          fi

  prepare:
    name: 解析镜像
    needs: guard
    if: needs.guard.outputs.is_project == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.img.outputs.image }}
    steps:
      - id: img
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          DEFAULT_IMAGE: ${{ env.CI_IMAGE }}
        run: echo "image=${INPUT_IMAGE:-$DEFAULT_IMAGE}" >> "$GITHUB_OUTPUT"

  build:
    name: 构建（debug / 未签名）
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 打印工具链版本
        run: |
          set -x
          node -v || true
          hvigorw --version || true
          ohpm -v || true

      - name: 探测镜像里的 SDK 与模板
        run: |
          set -x
          ls /opt/command-line-tools 2>/dev/null || true
          ls /opt/command-line-tools/sdk 2>/dev/null || true
          find /opt/command-line-tools -maxdepth 4 -name 'sdk' -type d 2>/dev/null | head -5
          echo '--- 镜像里自带的 hvigor-config 模板（若有）---'
          find / -name 'hvigor-config.json5' -not -path '/proc/*' 2>/dev/null | head -10
          for f in $(find / -name 'hvigor-config.json5' -not -path '/proc/*' 2>/dev/null | head -3); do
            echo "== $f"; cat "$f" | head -20
          done

      - name: 剥离本机签名配置
        run: |
          if [ -f .github/scripts/strip_signing.py ]; then
            python3 .github/scripts/strip_signing.py build-profile.json5
          fi

      - name: 缓存 hvigor 与 oh_modules
        uses: actions/cache@v4
        with:
          path: |
            /root/.hvigor
            **/oh_modules
          key: hvigor-${{ runner.os }}-${{ hashFiles('**/oh-package-lock.json5') }}
          restore-keys: |
            hvigor-${{ runner.os }}-

      - name: 安装依赖
        run: ohpm install --all

      - name: 准备本机运行时（libnode + dsh 核心树）
        continue-on-error: true
        run: |
          bash scripts/prepare-local-runtime.sh

      - name: 缓存运行时物料
        uses: actions/cache@v4
        with:
          path: |
            entry/libs
            entry/src/main/resources/resfile
          key: local-runtime-${{ hashFiles('scripts/prepare-local-runtime.sh') }}

      - name: 构建 HAP（对齐镜像 SDK，逐个试 modelVersion）
        env:
          SDK_VERSION: ${{ inputs.sdk || '26.0.0' }}
        run: |
          set -uo pipefail
          # 镜像带的是 API 26 的 SDK，工程里两处版本号都要对上：
          #   build-profile.json5  -> compileSdkVersion / compatibleSdkVersion
          #   hvigor-config.json5  -> modelVersion（与 oh-package.json5 同步）
          python3 .github/scripts/patch-sdk.py build-profile.json5 \
            --compile "$SDK_VERSION" --compatible "$SDK_VERSION"
          CANDIDATES=("$SDK_VERSION" "6.1.1" "6.0.0")
          ok=0
          for v in "${CANDIDATES[@]}"; do
            echo "::group::尝试 modelVersion=$v（SDK=$SDK_VERSION）"
            python3 .github/scripts/ci-prepare.py "$v"
            if hvigorw assembleHap --mode module -p product=default -p buildMode=debug \
                 --no-daemon --stacktrace 2>&1 | tee "/tmp/build-$v.log"; then
              echo "::endgroup::"
              echo "::notice::构建成功，modelVersion=$v"
              ok=1
              break
            fi
            echo "::endgroup::"
            echo "::warning::modelVersion=$v 失败，换下一个"
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::所有候选都失败，见上方日志"
            exit 1
          fi

      - name: 收集并校验产物
        run: |
          set -eu
          mkdir -p dist
          find . -type f -name '*.hap' -path '*/outputs/*' \
            -not -path './oh_modules/*' -not -path './node_modules/*' \
            -exec cp -v {} dist/ \;
          shopt -s nullglob
          haps=(dist/*.hap)
          if [ ${#haps[@]} -eq 0 ]; then
            echo "::error::没有产出 hap，看上面日志"
            exit 1
          fi
          for h in "${haps[@]}"; do
            echo "$h : $(stat -c%s "$h") bytes"
          done

      - name: 上传 HAP
        uses: actions/upload-artifact@v4
        with:
          name: hap-unsigned
          compression-level: 0
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: 失败时也把日志带出来
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build-*.log
          if-no-files-found: ignore
          retention-days: 7
